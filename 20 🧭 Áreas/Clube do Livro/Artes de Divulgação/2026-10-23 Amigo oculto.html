<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Amigo oculto · Trama do Rio</title>
<link rel="stylesheet" href="_fontes/fontes.css">
<style>
/* Tipografia: título = Alfa Slab One, texto = Quicksand, script só em um destaque */
:root{--chiclete:#F2609F;--creme:#FFF4E0;--cereja:#C63236;--vinho:#5A1830;--noite:#3A1220;--lima:#CFDD5A}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:var(--chiclete);position:relative;font-family:'Quicksand',sans-serif;color:var(--vinho)}
.e{position:absolute}
.tape{position:absolute;background:var(--lima);color:var(--noite);font-weight:700;letter-spacing:.22em;font-size:26px;padding:14px 0;transform:rotate(-3deg);left:290px;top:88px;width:500px;text-align:center}
.card{position:absolute;left:100px;top:178px;width:880px;height:560px;background:var(--creme);transform:rotate(-2deg);border:4px solid var(--vinho);text-align:center;padding-top:40px}
.pin{font-family:'Pinyon Script',cursive;font-size:78px;color:var(--cereja);line-height:1}
h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:166px;line-height:.9;color:var(--vinho);margin-top:12px}
.sub{font-weight:700;font-size:36px;color:var(--cereja);margin-top:30px}
.row{position:absolute;left:100px;top:782px;width:880px;display:flex;gap:28px;align-items:stretch}
.cta{background:var(--lima);border:4px solid var(--vinho);padding:30px 34px;transform:rotate(1.2deg);flex:2.1;color:var(--noite)}
.cta p{font-family:'Alfa Slab One';font-size:52px;line-height:1.05}
.cta span{display:block;font-weight:700;font-size:29px;line-height:1.25;margin-top:16px}
.tk{background:var(--vinho);padding:34px 30px;transform:rotate(-1.5deg);flex:1;color:var(--creme);display:flex;flex-direction:column;justify-content:center}
.tk small{font-weight:700;letter-spacing:.2em;font-size:22px;color:var(--lima)}
.tk b{font-family:'Alfa Slab One';font-weight:400;font-size:76px;line-height:1.05;display:block;margin:6px 0 8px}
.tk span{font-weight:500;font-size:26px;line-height:1.25}
.foot{position:absolute;left:0;right:0;bottom:64px;text-align:center}
.foot img{width:205px}
</style></head><body>

<img class="e" src="../../../10 🎯 Projetos/Identidade Visual da Trama do Rio/3 Núcleo da marca/Elementos/Dots 5.svg" style="width:140px;right:46px;top:96px">
<img class="e" src="../../../10 🎯 Projetos/Identidade Visual da Trama do Rio/3 Núcleo da marca/Elementos/Folha 4.svg" style="width:230px;right:-60px;top:1090px;transform:rotate(-8deg)">
<div class="tape">TEM TRAMA NO AR</div>

  <h1>AMIGO<br>OCULTO</h1>

</div>
<div class="row">

  <div class="tk"><small>SORTEIO</small><b>01/11</b><span>às 19h, pelo site. Sem reunião online.</span></div>
</div>
